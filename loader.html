<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Loader</title>
    <script>
        (function () {
            // Prevent redirects and url location changes
            try {
                Object.defineProperty(window, 'location', {
                    value: new Proxy(window.location, {
                        set(target, prop, value) {
                            console.warn("Blocked location change/redirect to:", value);
                            return true;
                        },
                        get(target, prop) {
                            if (prop === 'href' || prop === 'assign' || prop === 'replace') {
                                return target.href;
                            }
                            const val = target[prop];
                            return typeof val === 'function' ? val.bind(target) : val;
                        }
                    }),
                    writable: false,
                    configurable: true
                });
            } catch (e) {
                console.warn("Could not lock location object:", e);
            }

            // Helper to clean and route asset or relative paths correctly
            function resolveAssetUrl(val) {
                if (!val || typeof val !== 'string') return val;

                // If it's already pointing to your worker domain but missing /src/, fix it
                if (val.includes('jsdelivralt.lolzyfurr.workers.dev') && !val.includes('/src/')) {
                    return val.replace('jsdelivralt.lolzyfurr.workers.dev/', 'jsdelivralt.lolzyfurr.workers.dev/src/');
                }

                // If it's an absolute external URL (other than your worker), leave it alone
                if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:') || val.startsWith('blob:')) {
                    return val;
                }

                // Handle Discord API / routing paths
                if (val.startsWith('/api/') || val.startsWith('/channels/') || val.startsWith('/users/')) {
                    return 'https://discord.com' + val;
                }

                // Clean up local file protocols, drive letters, leading slashes, or redundant 'assets/' prefixes
                let cleanPath = val
                    .replace(/^(\/|file:\/\/.*\/|[A-Za-z]:\\.*\\)/, '')
                    .replace(/^assets\//, '');

                // Route everything else through your worker with /src/assets/ enforced
                return `https://jsdelivralt.lolzyfurr.workers.dev/src/assets/${cleanPath}`;
            }

            // Intercept document.createElement to catch dynamically created scripts and links
            const originalCreateElement = document.createElement;
            document.createElement = function (tagName, options) {
                const element = originalCreateElement.call(document, tagName, options);
                if (tagName && tagName.toLowerCase() === 'script') {
                    const originalSetAttribute = element.setAttribute;
                    element.setAttribute = function (name, value) {
                        if (name === 'src') {
                            value = resolveAssetUrl(value);
                        }
                        return originalSetAttribute.call(this, name, value);
                    };
                    Object.defineProperty(element, 'src', {
                        set(value) {
                            element.setAttribute('src', value);
                        },
                        get() {
                            return element.getAttribute('src');
                        },
                        configurable: true
                    });
                }
                return element;
            };

            // Intercept fetch to route local assets to CDN or prepend discord.com for relative requests
            const originalFetch = window.fetch;
            if (originalFetch) {
                window.fetch = function (resource, init) {
                    let url = resource;
                    if (typeof url === 'string') {
                        url = resolveAssetUrl(url);
                    }
                    return originalFetch.call(this, url, init);
                };
            }

            // Intercept dynamic element creation for src/href attributes
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    mutation.addedNodes.forEach((node) => {
                        if (node.nodeType === 1) {
                            ['src', 'href'].forEach((attr) => {
                                if (node.hasAttribute && node.hasAttribute(attr)) {
                                    let val = node.getAttribute(attr);
                                    let fixed = resolveAssetUrl(val);
                                    if (fixed !== val) {
                                        node.setAttribute(attr, fixed);
                                    }
                                }
                            });
                        }
                    });
                });
            });
            observer.observe(document, { childList: true, subtree: true });

            let isStorageWorking = true;
            try {
                const testKey = '__test_storage__';
                localStorage.setItem(testKey, testKey);
                localStorage.removeItem(testKey);
            } catch (e) {
                isStorageWorking = false;
            }

            if (!isStorageWorking || typeof localStorage === 'undefined') {
                class MemoryStorage {
                    constructor() {
                        this.store = {};
                    }
                    getItem(key) {
                        return Object.prototype.hasOwnProperty.call(this.store, key) ? this.store[key] : null;
                    }
                    setItem(key, value) {
                        this.store[key] = String(value);
                    }
                    removeItem(key) {
                        delete this.store[key];
                    }
                    clear() {
                        this.store = {};
                    }
                    key(index) {
                        const keys = Object.keys(this.store);
                        return keys[index] !== undefined ? keys[index] : null;
                    }
                    get length() {
                        return Object.keys(this.store).length;
                    }
                }
                const mockStorage = new MemoryStorage();
                try {
                    Object.defineProperty(window, 'localStorage', {
                        value: mockStorage,
                        writable: true,
                        configurable: true
                    });
                    Object.defineProperty(window, 'sessionStorage', {
                        value: new MemoryStorage(),
                        writable: true,
                        configurable: true
                    });
                } catch (err) {
                    window.localStorage = mockStorage;
                    window.sessionStorage = new MemoryStorage();
                }
            }

            const storageKey = 'token';
            let token = null;

            try {
                token = localStorage.getItem(storageKey);
                if (token) {
                    try { token = JSON.parse(token); } catch (e) { }
                }
            } catch (e) {
                console.warn("Local storage unavailable, using fallback memory store.");
            }

            while (!token || typeof token !== 'string' || token.trim() === "") {
                token = prompt("Enter your Discord Token to launch:");
                if (token === null) {
                    alert("A token is required to run this application.");
                    continue;
                }
                token = token.trim();
            }

            try {
                localStorage.setItem(storageKey, JSON.stringify(token));
            } catch (e) {
                window.__fallbackTokenStore = token;
            }

            const originalGetItem = Storage.prototype.getItem;
            if (originalGetItem) {
                Storage.prototype.getItem = function (key) {
                    if (key === storageKey) {
                        let val = originalGetItem.call(this, key);
                        if (!val && window.__fallbackTokenStore) return JSON.stringify(window.__fallbackTokenStore);
                        return val;
                    }
                    return originalGetItem.call(this, key);
                };
            }
        })();
    </script>
    <script>
        fetch('https://jsdelivralt.lolzyfurr.workers.dev/app.html')
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(err => console.error('Failed to load HTML:', err));
    </script>
</head>

<body>
    <p>Loading application...</p>
</body>

</html>
